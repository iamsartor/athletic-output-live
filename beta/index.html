<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Output Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
/* Layout: one-column phone scoreboard. Header + round switch, team tabs, 2x2 station counters, standings table, team setup. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --fg: #16191a;
  --muted: #5f6763;
  --line: #d3d8d3;
  --accent: #1f6feb;
  --accent-fg: #ffffff;
  --press: #e3e7e2;
  --danger: #c2321f;
  --t1: #1f6feb; --t2: #d9480f; --t3: #2b8a3e; --t4: #9c36b5; --t5: #c08a00; --t6: #0c8599;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111413; --surface: #1b1f1e; --fg: #eef1ee; --muted: #9aa39f; --line: #2c3331;
  --accent: #5b9dff; --accent-fg: #0b1220; --press: #262c2a; --danger: #ff6b55;
  --t1: #5b9dff; --t2: #ff8a4c; --t3: #5fcf75; --t4: #d27ff0; --t5: #f2c230; --t6: #3fc7dc;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111413; --surface: #1b1f1e; --fg: #eef1ee; --muted: #9aa39f; --line: #2c3331;
  --accent: #5b9dff; --accent-fg: #0b1220; --press: #262c2a; --danger: #ff6b55;
  --t1: #5b9dff; --t2: #ff8a4c; --t3: #5fcf75; --t4: #d27ff0; --t5: #f2c230; --t6: #3fc7dc;
  color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; margin: 0; letter-spacing: .01em; text-transform: uppercase; }
h1 small { display: block; font-family: var(--body); font-weight: 600; font-size: .75rem; letter-spacing: .08em; color: var(--muted); margin-top: 4px; }
h2 { font-family: var(--display); font-weight: 800; font-size: 1.3rem; text-transform: uppercase; letter-spacing: .03em; margin: 0; }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { font-family: var(--display); font-weight: 800; font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase; padding: 8px 16px; border-radius: 999px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.teams { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.teams button { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; }
.teams button .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tc); }
.teams button[aria-pressed="true"] { border-color: var(--tc); box-shadow: inset 0 0 0 1px var(--tc); }

.board { border-top: 6px solid var(--tc); background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.board-head .name { font-family: var(--display); font-weight: 800; font-size: 1.5rem; text-transform: uppercase; }
.board-head .rnd { color: var(--muted); font-size: .85rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }

.st { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.st-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.st-name { font-weight: 600; font-size: .9rem; }
.st-unit { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.st-info { font-size: .72rem; color: var(--muted); margin-top: -6px; }
.st-val { font-family: var(--display); font-weight: 800; font-size: 3.2rem; line-height: .95; font-variant-numeric: tabular-nums; text-align: center; width: 100%; padding: 2px 0; border-radius: 8px; }
.st-val:active { background: var(--press); }
.st-input { font-family: var(--display); font-weight: 800; font-size: 2.6rem; text-align: center; width: 100%; border: 2px solid var(--accent); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 2px 0; }
.st-other { text-align: center; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.btns button { padding: 12px 0; border-radius: 10px; background: var(--press); font-family: var(--display); font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.btns button.plus { background: var(--tc); color: var(--accent-fg); }
.btns button:active { transform: scale(.96); }
.minus-row { display: flex; justify-content: center; }
.minus-row button { font-size: .8rem; color: var(--muted); padding: 4px 10px; border-radius: 8px; }
.minus-row button:active { background: var(--press); }

.card { background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.tools > summary { background: var(--surface); border-radius: 14px; padding: 14px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.tools > summary::-webkit-details-marker { display: none; }
.tools > summary::after { content: "Show"; font-size: .8rem; font-weight: 600; color: var(--muted); }
.tools[open] > summary::after { content: "Hide"; }
.tools > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tools-body { display: flex; flex-direction: column; gap: 18px; margin-top: 18px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .9rem; }
th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td .rk { display: block; font-size: .7rem; color: var(--muted); }
td.pts { font-family: var(--display); font-weight: 800; font-size: 1.2rem; }
tr.lead td.pts { color: var(--accent); }
.tname { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.tname .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); }
.note { font-size: .8rem; color: var(--muted); margin: 0; line-height: 1.45; }

.setup-row { display: flex; gap: 8px; align-items: center; }
.setup-row input { flex: 1; min-width: 0; font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.setup-row .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--tc); flex: 0 0 auto; }
.ghost { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); font-weight: 600; font-size: .9rem; }
.ghost.danger { color: var(--danger); border-color: var(--danger); }
.solid-danger { padding: 9px 12px; border-radius: 8px; background: var(--danger); color: var(--surface); font-weight: 600; font-size: .9rem; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
@media (prefers-reduced-motion: reduce) { .btns button:active { transform: none; } }
.live { border-left: 6px solid var(--tc, var(--accent)); }
.live-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.code { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: .12em; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--t3); }
.conn.off::before { background: var(--danger); }
.solid { padding: 11px 14px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick button { padding: 18px 10px; border-radius: 12px; border: 2px solid var(--tc); background: var(--surface); font-family: var(--display); font-weight: 800; font-size: 1.3rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; }
.pick .dot, .link-row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tc); flex: 0 0 auto; }
.link-row { display: flex; align-items: center; gap: 8px; }
.link-row span.n { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.ghost, a.solid { color: inherit; text-decoration: none; display: inline-block; }
a.solid { color: var(--accent-fg); }
h3.sub { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.date { font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
[hidden] { display: none !important; }
/* v2: wide stations, clock, AMRAP pair, EMOM minute grid, workout card */
.st.wide { grid-column: 1 / -1; }
.btns.two { grid-template-columns: 1fr 1fr; }
.btns.one { grid-template-columns: 1fr; }
.btns button:disabled { opacity: .4; cursor: default; transform: none; }
.center { text-align: center; justify-content: center; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.clockbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.clock-val { font-family: var(--display); font-weight: 800; font-size: 2rem; font-variant-numeric: tabular-nums; line-height: 1; }
.mins { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.mins button { border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.mins b { font-size: .7rem; color: var(--muted); font-weight: 600; }
.mins span { font-size: .68rem; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mins i { font-style: normal; font-family: var(--display); font-weight: 800; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.mins button.sel { border: 2px solid var(--tc); }
.mins button.now { background: var(--press); }
.mins button.ok i { color: var(--t3); }
.mins button.miss i { color: var(--danger); }
.mins button.later { opacity: .55; }
.gbar { display: flex; gap: 2px; margin-top: 4px; }
.gbar i { flex: 1; height: 6px; min-width: 2px; border-radius: 2px; background: var(--line); }
.gbar i.ok { background: var(--t3); }
.gbar i.miss { background: var(--danger); }
.min-panel { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
select.date { max-width: 100%; }
/* Workout list and paste box */
.w-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.w-row .n { flex: 1 1 200px; min-width: 0; }
.w-row .n b { display: block; }
.w-row .n span { display: block; font-size: .8rem; color: var(--muted); line-height: 1.4; }
.paste { font: .85rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); resize: vertical; }
.err { color: var(--danger); font-size: .85rem; margin: 0; }
/* Personal bests, QR codes, big screen */
.pb { display: inline-block; margin-left: .3em; padding: .1em .45em; border-radius: 999px; background: var(--t5); color: #16191a; font-family: var(--body); font-size: .62rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; vertical-align: middle; line-height: 1.3; }
.pb.rec { background: var(--accent); color: var(--accent-fg); }
.qr { background: #fff; padding: 10px; border-radius: 10px; line-height: 0; }
.qr svg { width: 100%; height: auto; display: block; }
.qr.big { width: min(78vw, 340px); margin: 0 auto; }
.qr-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.qr-pick button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; font-size: .9rem; }
.qr-pick button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
body.screen .wrap { max-width: none; padding: 2.5vw 3vw; }
body.screen header { display: none; }
#screen { display: flex; flex-direction: column; gap: 2.5vw; }
.scr-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 2vw; flex-wrap: wrap; }
.scr-title { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 5vw, 5.5rem); text-transform: uppercase; line-height: .9; }
.scr-sub { color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.8rem); font-weight: 600; margin: .3em 0 0; }
.scr-clock { font-family: var(--display); font-weight: 800; font-size: clamp(2.5rem, 7vw, 8rem); font-variant-numeric: tabular-nums; line-height: .9; }
.scr-main { display: grid; grid-template-columns: 1fr auto; gap: 3vw; align-items: start; }
.scr-tbl { font-size: clamp(1.1rem, 2.4vw, 2.8rem); background: var(--surface); border-radius: 14px; }
.scr-tbl th, .scr-tbl td { padding: .45em .5em; }
.scr-tbl th { font-size: .42em; }
.scr-tbl th:nth-child(2), .scr-tbl td:nth-child(2) { text-align: left; }
.scr-tbl td { font-family: var(--display); font-weight: 800; }
.scr-tbl td.pts { font-size: 1.3em; }
.scr-tbl .tname { font-family: var(--body); font-weight: 600; }
.scr-tbl .place { font-family: var(--display); font-weight: 800; font-size: 1.3em; text-align: center; width: 1.6em; }
.scr-tbl .tname { gap: .35em; }
.scr-tbl .tname .dot { width: .55em; height: .55em; }
.scr-tbl .rk { font-size: .45em; }
.scr-tbl .pb { font-size: .38em; }
.glitter { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.glitter-msg { position: fixed; left: 50%; top: 40%; z-index: 51; pointer-events: none; white-space: nowrap; font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 9vw, 7rem); text-transform: uppercase; color: var(--fg); text-shadow: 0 0 .3em var(--bg), 0 0 .6em var(--bg); animation: glitter-pop 2.8s ease forwards; }
@keyframes glitter-pop { 0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; } 12% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; } 20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .glitter-msg { animation-duration: 2.8s; animation-name: glitter-fade; transform: translate(-50%, -50%); } @keyframes glitter-fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } } }
#title, .scr-title { -webkit-user-select: none; user-select: none; }
.scr-join { background: var(--surface); border-radius: 14px; padding: 1.2vw; text-align: center; width: clamp(160px, 17vw, 320px); }
@media (max-width: 800px) { .scr-main { grid-template-columns: 1fr; } .scr-join { display: none; } }
</style>
</head><body>

<div class="wrap">
  <section id="screen" hidden></section>

  <header>
    <h1 id="title">Team Output<small id="subtitle"></small></h1>
    <div class="seg" role="group" aria-label="Round" id="roundSeg"></div>
  </header>

  <section class="card live" id="live" hidden></section>

  <section class="card" id="qrCard" hidden></section>

  <section class="card" id="picker" hidden>
    <h2>Which team are you?</h2>
    <div class="pick" id="pickList"></div>
    <div class="actions"><button class="ghost" data-role="trainer">I'm the trainer</button></div>
  </section>

  <nav class="teams" id="teams" aria-label="Teams"></nav>

  <section class="board" id="board" aria-live="polite"></section>

  <section class="card" id="standCard">
    <h2>Standings</h2>
    <div class="tbl-wrap"><table id="standings"></table></div>
    <p class="note" id="standNote"></p>
  </section>

  <!-- Everything the trainer needs now and then, closed by default so the scoreboard stays on the first screen. -->
  <details class="tools" id="tools" hidden>
    <summary id="toolsLabel">Trainer tools</summary>
    <div class="tools-body">
      <section class="card" id="linksCard" hidden></section>

      <section class="card" id="sessionsCard" hidden></section>

      <section class="card" id="historyCard" hidden></section>

      <section class="card" id="workoutCard" hidden></section>

      <section class="card" id="setupCard">
        <h2>Teams</h2>
        <div id="setup" style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="actions">
          <button class="ghost" id="addTeam">Add team</button>
          <span id="resetArea"><button class="ghost danger" id="reset">Reset all counts</button></span>
        </div>
      </section>
    </div>
  </details>
</div>

<script type="module">
// ======================= WORKOUTS =======================
// Everything about a class format lives here. For a new month: add a workout to WORKOUTS (or edit one)
// and point DEFAULT_WORKOUT at it. New sessions start with DEFAULT_WORKOUT, and the trainer can switch a
// session to any workout in the list (or a pasted one) from the Workouts card. Each session saves a copy of its workout,
// so editing this list later never changes past results.
//
//   id         letters, digits and dashes (max 20)
//   name       shown as the page title
//   place      optional, shown in the line under the title
//   teams      how many teams a fresh phone starts with; teamSize is only shown in the subtitle
//   rounds     1 to 10; every station is done once per round and scored over all rounds
//   stations   one or more, each with an id (max 8 lowercase letters/digits), a name, a type and info:
//     count  max reps, cals or meters (today's format). unit, steps (the + buttons)
//     time   for time. cap in seconds. totalReps is optional: with it a capped team scores the cap plus
//            one second per missing rep; without it capped teams rank behind all finishers, by reps
//     amrap  rounds plus reps. cap in seconds (shown as a countdown). With repsPerRound, teams only count
//            reps and full rounds roll over by themselves
//     emom   every minute on the minute. minutes (max 60), moves (rotate each minute),
//            measure "done" (a grid of minutes: they tick themselves off as the clock passes them, a team
//            only taps a missed one) or "reps" (count reps each minute). An EMOM is a team's own progress
//            grid and isn't ranked, unless the station has scored: true
// Scoring: each station (except unscored EMOMs) ranks the teams; points add up the ranks over all stations and the lowest wins.
// Mixing types in one workout works the same way (for example an EMOM part and a for-time part).

// Sessions saved before workouts existed have no copy of their workout and use this one,
// so keep it exactly as it is. To change Team Output, add a new entry with a new id.
const TEAM_OUTPUT = {
  id: "team-output", name: "Team Output", place: "Thursday Athletic", teams: 4, teamSize: 3, rounds: 2,
  stations: [
    { id: "erg", name: "Erg",       type: "count", unit: "cals",   steps: [1, 5, 10],    info: "90s/person · Ski, Row, Bike" },
    { id: "wb",  name: "Wallballs", type: "count", unit: "reps",   steps: [1, 5, 10],    info: "5 min AMRAP · max 20/ball" },
    { id: "run", name: "Run",       type: "count", unit: "meters", steps: [10, 50, 100], info: "5 min · +1% incline/min" },
    { id: "bbj", name: "BBJs",      type: "count", unit: "lanes",  steps: [1, 2, 5],     info: "2 work · 1 rest · 6 m lane" },
  ],
};

// Other workouts come from the trainer: pasted in the Workouts card (under Trainer tools) and shared
// with every phone. Real Kaifu Lodge cards written in this format are in card-examples/README.md.
const WORKOUTS = [TEAM_OUTPUT];

const DEFAULT_WORKOUT = "team-output";
// ===================== END WORKOUTS =====================

// Live scoring: the firebaseConfig block from the Firebase console. With null the app runs on one phone only.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDBSdlwWWlIypP7_EiDb6FrHmpH_ElxnzQ",
  authDomain: "team-output-counter.firebaseapp.com",
  databaseURL: "https://team-output-counter-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "team-output-counter",
  storageBucket: "team-output-counter.firebasestorage.app",
  messagingSenderId: "112958855502",
  appId: "1:112958855502:web:2cd59244a8b4815ffba61f"
};
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";

const KEY = "team-output-live-v2"; // own key: both apps share the iamsartor.github.io address, so they must not share saved data
// v1 is the key of the app before workouts. It stays untouched so that version still works on the same phone (beta folder);
// a phone's first visit starts from it, so team ids and names carry over.
const OLD_KEY = "team-output-live-v1";
const COLORS = 6;
const TYPES = { count: "max", time: "for time", amrap: "rounds + reps", emom: "EMOM" };

    await live.fb.update(live.fb.ref(live.db), { ["events/" + id]: newSession(byId(startPick) || DEFAULT), current: id });
    sessionList = null; loadSessions();
    if (forcedEvent) location.href = baseUrl(); else { latest = id; openEvent(id); }
  } catch (e) {
    btn.disabled = false; btn.textContent = extra ? "Start extra session" : "Start today's session";
    liveMsg = e.message === "full" ? `There are already ${MAX_PER_DAY} sessions today, which is the most a day can have.` : "Couldn't start the session. Check the connection and try again.";
    renderLive();
  }
}

async function share(url, btn) {

}

// The pieces stations are built from.
function bigVal(key, shown, label, time = false, inputVal = shown) {
  return editing === key
    ? `<input class="st-input" id="edit" data-key="${key}" ${time ? `type="text" inputmode="decimal" placeholder="m:ss"` : `type="number" inputmode="numeric" min="0"`} value="${inputVal}" aria-label="${esc(label)}">`
    : `<button class="st-val" data-edit="${key}" aria-label="${esc(label)}: ${shown}. Tap to type ${time ? "a time" : "a number"}">${shown}</button>`;
}
const stepBtns = (key, steps) => `
  <div class="btns">${steps.map(n => `<button class="plus" data-k="${key}" data-d="${n}">+${n}</button>`).join("")}</div>
  <div class="minus-row"><button data-k="${key}" data-d="${-steps[0]}">Undo &minus;${steps[0]}</button></div>`;
const top = (name, unit) => `<div class="st-top"><span class="st-name">${esc(name)}</span><span class="st-unit">${esc(unit)}</span></div>`;
const info = s => s.info ? `<div class="st-info">${esc(s.info)}</div>` : "";
const totalLine = (s, t) => W.rounds > 1 ? `<div class="st-other">Total over all rounds: ${score(s, t).text}</div>` : "";

const emomSel = {}, lastMinute = {};
const STATION = {
  count: (s, t, r) => `
    <div class="st">${top(s.name, s.unit)}${info(s)}
      ${bigVal(s.id, val(t, r, s.id), `${s.name} ${s.unit}`)}
      ${stepBtns(s.id, s.steps)}
      ${W.rounds > 1 ? `<div class="st-other">${roundList().filter(x => x !== r).map(x => `Runde ${x + 1}: ${val(t, x, s.id)}`).join(" · ")} · Total ${score(s, t).text}</div>` : ""}
    </div>`,
  time: (s, t, r) => {
    const T = val(t, r, s.id + "_t"), capped = val(t, r, s.id + "_c"), running = clockStart(r);
    const label = `${s.name} time`;
    const body = capped ? `
        <div class="st-info center">Time cap${s.cap ? " " + fmt(s.cap) : ""}. ${s.target ? `${s.unit} done of ${s.target}` : `Reps done${s.totalReps ? " of " + s.totalReps : ""}`}:</div>
        ${bigVal(s.id + "_r", val(t, r, s.id + "_r"), `${s.name} reps at the time cap`)}
        ${stepBtns(s.id + "_r", s.steps)}
        <div class="minus-row"><button data-act="clear:${s.id}">Clear result</button></div>`
      : T ? `
        ${bigVal(s.id + "_t", fmt(T), label, true)}
        ${s.target ? `<div class="st-info center">Goal of ${s.target} ${esc(s.unit)} reached</div>` : ""}
        <div class="minus-row"><button data-act="clear:${s.id}">Clear result</button></div>`
      : s.target ? `
        ${bigVal(s.id + "_r", val(t, r, s.id + "_r"), `${s.name} ${s.unit} so far`)}
        <div class="st-other">of ${s.target} ${esc(s.unit)}</div>
        ${stepBtns(s.id + "_r", s.steps)}
        <div class="btns two"><button class="plus" data-act="fin:${s.id}" ${running ? "" : "disabled"}>Finished</button>${s.cap ? `<button data-act="cap:${s.id}">Time cap</button>` : ""}</div>
        <div class="st-info center">${running ? `The time is taken when the team reaches ${s.target} ${esc(s.unit)}.` : "Waiting for the clock. Or tap a number to type it."}</div>`
      : `
        ${bigVal(s.id + "_t", "–:–", label, true, "")}
        <div class="btns two"><button class="plus" data-act="fin:${s.id}" ${running ? "" : "disabled"}>Finished</button>${s.cap ? `<button data-act="cap:${s.id}">Time cap</button>` : ""}</div>
        ${running ? "" : `<div class="st-info center">Finished stops the clock for this team once it runs. Or tap the time to type it.</div>`}`;
    return `<div class="st wide">${top(s.name, (s.target ? `${s.target} ${s.unit} for time` : "for time") + (s.cap ? " · cap " + fmt(s.cap) : ""))}${info(s)}${body}${totalLine(s, t)}</div>`;
  },
  amrap: (s, t, r) => `
    <div class="st wide">${top(s.name, "rounds + reps" + (s.cap ? " · " + fmt(s.cap) : ""))}${info(s)}
      <div class="pair">
        <div><div class="st-unit center">Rounds</div>${bigVal(s.id + "_n", val(t, r, s.id + "_n"), `${s.name} rounds`)}
          <div class="btns one"><button class="plus" data-k="${s.id}_n" data-d="1">+1 round</button></div>
          <div class="minus-row"><button data-k="${s.id}_n" data-d="-1">Undo &minus;1</button></div></div>
        <div><div class="st-unit center">Reps${s.repsPerRound ? ` (of ${s.repsPerRound})` : ""}</div>${bigVal(s.id + "_r", val(t, r, s.id + "_r"), `${s.name} reps`)}
          ${stepBtns(s.id + "_r", s.steps)}</div>
      </div>
      ${s.repsPerRound ? `<div class="st-info center">Just count reps: every ${s.repsPerRound} make a round by themselves.</div>` : ""}
      ${totalLine(s, t)}
    </div>`,
  emom: (s, t, r) => {
    const done = s.measure === "done", now = minuteNow(s), sel = emomSel[s.id] || now || 1;
    const move = m => s.moves[(m - 1) % s.moves.length];
    const cells = [...Array(s.minutes)].map((_, k) => {
      const m = k + 1, x = val(t, r, `${s.id}_m${m}`);
      const cls = [m === now ? "now" : "", !done && m === sel ? "sel" : "", done && x === 1 ? "ok" : "", done && x === 2 ? "miss" : "", done && clockStart(r) && m > now ? "later" : ""].join(" ");
      const shown = done ? (x === 1 ? "✓" : x === 2 ? "✗" : "·") : x;
      return `<button class="${cls}" data-min="${s.id}:${m}" aria-label="Minute ${m}, ${esc(move(m))}: ${done ? (x === 1 ? "done" : x === 2 ? "missed" : "not marked") : x + " reps"}"><b>${m}</b><span>${esc(move(m))}</span><i>${shown}</i></button>`;
    }).join("");
    const key = `${s.id}_m${sel}`;
    const panel = done
      ? `<div class="st-info center">${clockStart(r) ? "Minutes tick themselves off as the clock passes them. Only tap a minute your team missed (tap again to undo)."
        : "Minutes tick themselves off once the trainer starts the clock. Without the clock: tap once for done, again for missed, a third time to clear."}</div>`
      : `<div class="min-panel">${top(`Minute ${sel} · ${move(sel)}`, "reps")}${bigVal(key, val(t, r, key), `Minute ${sel} reps`)}${stepBtns(key, s.steps)}</div>`;
    return `<div class="st wide">${top(s.name, `${s.minutes} min · ${done ? "minutes done" : "reps"}${s.scored ? "" : " · not ranked"}`)}${info(s)}
      <div class="mins">${cells}</div>${panel}
      <div class="st-other">${W.rounds > 1 ? "Total over all rounds" : "Total"}: ${score(s, t).text}</div></div>`;
  },
};

function clockBar() {
  if (!timed() || (live && eventId && !eventId.startsWith(today()))) return "";
  const running = clockStart(state.round);
  const ctl = !canRunClock() ? (running ? "" : `<span class="note">The trainer starts the clock</span>`)
    : running ? `<span id="clockArea"><button class="ghost" id="clockReset">Reset clock</button></span>`
    : `<button class="solid" id="clockStart">Start clock</button>`;
  return `<div class="clockbar"><span class="clock-val" data-clock>${clockText()}</span>${ctl}</div>`;
}

function renderBoard() {
  const i = state.active, t = state.teams[i], r = state.round;
  const board = $("board");
  if (!t) { board.innerHTML = ""; return; }
  board.setAttribute("style", tc(i));
  board.innerHTML = `
    <div class="board-head"><span class="name">${esc(t.name)}</span><span class="rnd">${W.rounds > 1 ? "Runde " + (r + 1) : ""}</span></div>
    ${clockBar()}
    <div class="grid">${W.stations.map(s => STATION[s.type](s, t, r).replace(/<\/div>\s*$/, pbLine(s, t) + "</div>")).join("")}</div>`;
  if (editing) {
    const inp = $("edit");
    if (!inp) { editing = null; return; }
    inp.focus(); inp.select();
    const commit = () => {
      const key = editing;
      if (key.endsWith("_t") && stationOf(key)?.type === "time") {
        const secs = inp.value.trim() ? parseTime(inp.value) : 0;
        if (secs !== null) { setValue(state.active, key, secs); setValue(state.active, key.slice(0, -2) + "_c", 0); }
      } else setValue(state.active, key, Number(inp.value) || 0);
      editing = null; save(); renderAll();
    };
    inp.addEventListener("blur", commit, { once: true });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
  }
}

// EMOM minutes the clock has fully passed. The team's own phone (or a phone on its own) saves those still
// unmarked as done, so a team only taps the minutes it missed. The trainer's phone leaves them alone,
// so it never overwrites a miss a team just tapped.
const minutesPassed = s => clockStart(state.round) ? Math.min(s.minutes, Math.floor(elapsed(state.round) / 60)) : 0;
const filled = {};
function fillPassed() {
  if (!(view === "team" || view === "local") || (live && eventId && !eventId.startsWith(today()))) return;
  const t = state.teams[state.active]; if (!t) return;
  for (const s of W.stations) if (s.type === "emom" && s.measure === "done") {
    const p = minutesPassed(s), k = [eventId, t.id, state.round, clockStart(state.round), s.id].join("|");
    if (!p || filled[k] >= p) continue;
    filled[k] = p;
    for (let m = 1; m <= p; m++) if (!val(t, state.round, `${s.id}_m${m}`)) setValue(state.active, `${s.id}_m${m}`, 1);
    save();
  }
}

// Shows the running clock and moves EMOM boards on to the new minute.
setInterval(() => {
  if (!timed()) return;
  document.querySelectorAll("[data-clock]").forEach(el => el.textContent = clockText());
  fillPassed();
  let moved = false;
  for (const s of W.stations) if (s.type === "emom") {
    const m = minuteNow(s);
    if (m && m !== lastMinute[s.id]) { lastMinute[s.id] = m; emomSel[s.id] = m; moved = true; }
  }
  if (moved && !editing) renderBoard();
}, 250);


const HOW = {
  count: s => `most ${s.unit} wins`,
  time: s => `fastest time wins; ${s.totalReps ? "a capped team scores the cap plus one second per missing rep" : "capped teams rank behind all finishers, by reps"}`,
  amrap: () => "most rounds plus reps wins",
  emom: s => s.measure === "done" ? "most minutes done wins" : "most reps over all minutes wins",
};
// Ranks every team on each station, then adds the ranks up to points (lowest wins). place shares ties.
function ranksOf(s, teams, w = W) {
  const keys = teams.map(t => score(s, t, w).key);
  return keys.map(k => 1 + keys.filter(o => cmp(o, k) < 0).length);
}
function table(w, teams) {
  const rs = w.stations.filter(ranked), rk = Object.fromEntries(rs.map(s => [s.id, ranksOf(s, teams, w)]));
  const rows = teams.map((t, i) => ({ t, i, pts: rs.reduce((a, s) => a + rk[s.id][i], 0) })).sort((a, b) => a.pts - b.pts);
  rows.forEach(r => r.place = 1 + rows.filter(o => o.pts < r.pts).length);
  return { rk, rows, n: rs.length };
}
const unitOf = s => s.type === "count" ? s.unit : s.type === "emom" ? (s.measure === "done" ? "minutes" : "reps") : TYPES[s.type];

// ---- History and personal bests ----
// Every phone in a live session reads all sessions once. A best compares the same workout (same id and
// rounds) and station over the sessions before the one on screen. Teams are matched by their id, which
// carries over from week to week, so a renamed team keeps its bests.
let allEvents = null, eventsVersion = 0, bestsMemo = null;
const skey = (w, s) => `${w.id}/${w.rounds}/${s.id}/${s.type}`;
const complete = (s, sc) => s.type === "time" ? sc.key[0] === 0 : sc.key.some(x => x < 0);
const shortDate = id => {
  const d = new Date(id.slice(0, 10) + "T12:00");
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", ...(d.getFullYear() !== new Date().getFullYear() ? { year: "numeric" } : {}) });
};
function pastSessions() {
  return Object.keys(allEvents || {}).sort().filter(id => id < (eventId || "9") && allEvents[id] && allEvents[id].teams).map(id => {
    const e = allEvents[id], w = e.workout ? parseWorkout(e.workout) || LEGACY : LEGACY;
    const teams = Object.keys(e.teams).sort((a, b) => e.teams[a].order - e.teams[b].order).map(tid => ({
      id: tid, name: e.teams[tid].name, counts: [...Array(w.rounds).keys()].map(r => ({ ...(e.counts?.[tid]?.["r" + r] || {}) })) }));
    return { id, w, teams };
  });
}
function bests() {
  const stamp = eventsVersion + "|" + eventId;
  if (bestsMemo && bestsMemo.stamp === stamp) return bestsMemo;
  const pb = {}, rec = {};
  for (const ev of pastSessions()) for (const s of ev.w.stations) {
    const k = skey(ev.w, s);
    for (const t of ev.teams) {
      const sc = score(s, t, ev.w); if (!complete(s, sc)) continue;
      const entry = { key: sc.key, text: sc.text, date: ev.id, team: t.name };
      if (!pb[t.id + "|" + k] || cmp(sc.key, pb[t.id + "|" + k].key) < 0) pb[t.id + "|" + k] = entry;
      if (!rec[k] || cmp(sc.key, rec[k].key) < 0) rec[k] = entry;
    }
  }
  return bestsMemo = { stamp, pb, rec };
}
// "Record" when a team beats every earlier result, "PB" when it beats its own earlier best.
function badge(s, t) {
  if (!allEvents) return "";
  const sc = score(s, t); if (!complete(s, sc)) return "";
  const b = bests(), k = skey(W, s), rec = b.rec[k], pb = b.pb[t.id + "|" + k];
  if (rec && cmp(sc.key, rec.key) < 0) return ` <span class="pb rec">Record</span>`;
  if (pb && cmp(sc.key, pb.key) < 0) return ` <span class="pb">PB</span>`;
  return "";
}
function pbLine(s, t) {
  if (!allEvents) return "";
  const pb = bests().pb[t.id + "|" + skey(W, s)];
  return pb ? `<div class="st-other">Team best: ${esc(pb.text)} (${esc(shortDate(pb.date))})${badge(s, t)}</div>` : "";
}
function renderHistory() {
  const el = $("historyCard");
  el.hidden = screenMode || !(live && allEvents && view === "trainer");
  if (el.hidden) return;
  const b = bests(), t = state.teams[state.active];
  const rec = W.stations.map(s => [s, b.rec[skey(W, s)]]).filter(([, r]) => r);
  const pbs = t ? W.stations.map(s => [s, b.pb[t.id + "|" + skey(W, s)]]).filter(([, p]) => p) : [];
  const past = pastSessions().slice(-12).reverse().map(ev => {
    const any = ev.teams.some(t => t.counts.some(c => Object.values(c).some(x => x)));
    const win = !table(ev.w, ev.teams).n ? "not ranked" : any ? table(ev.w, ev.teams).rows.filter(r => r.place === 1).map(r => r.t.name).join(" & ") : "no scores";
    return `<div class="link-row"><span class="n">${esc(shortDate(ev.id))}${ev.id.length > 10 ? " (extra)" : ""} · ${esc(ev.w.name)}</span><span class="note">${esc(win)}</span></div>`;
  }).join("");
  el.innerHTML = `
    <h2>History</h2>
    <h3 class="sub">Records · ${esc(W.name)}</h3>
    ${rec.length ? `<div class="tbl-wrap"><table><thead><tr><th>Station</th><th>Best</th><th>Team</th><th>Date</th></tr></thead><tbody>${rec.map(([s, r]) =>
      `<tr><td>${esc(s.name)}</td><td>${esc(r.text)}</td><td>${esc(r.team)}</td><td>${esc(shortDate(r.date))}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="note">No earlier sessions with this workout yet.</p>`}
    ${t ? `<h3 class="sub">${esc(t.name)} · team bests</h3>
    ${pbs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Station</th><th>Best</th><th>Date</th></tr></thead><tbody>${pbs.map(([s, p]) =>
      `<tr><td>${esc(s.name)}</td><td>${esc(p.text)}</td><td>${esc(shortDate(p.date))}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="note">No earlier results for this team with this workout.</p>`}` : ""}
    <h3 class="sub">Past sessions · winners</h3>
    ${past || `<p class="note">None yet.</p>`}
    <p class="note">Bests compare the same workout over earlier sessions. A team keeps its bests when it's renamed; a team that is removed and added again starts fresh.</p>`;
}

// ---- QR codes ----
// The QR library loads only when a code is first shown.
const QR_LIB = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
let qrLoading = null;
const qrSvg = {};
function loadQR() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  return qrLoading = qrLoading || new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = QR_LIB; s.onload = () => ok(window.qrcode); s.onerror = () => { qrLoading = null; fail(); };
    document.head.append(s);
  });
}
async function drawQR(el, url) {
  if (!el) return;
  if (qrSvg[url]) { el.innerHTML = qrSvg[url]; return; }
  try {
    const q = (await loadQR())(0, "M"); q.addData(url); q.make();
    qrSvg[url] = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true, alt: "QR code for " + url });
    if (el.isConnected) el.innerHTML = qrSvg[url];
  } catch { el.innerHTML = `<p class="note">Couldn't load the QR code. Use Send link instead.</p>`; }
}
let qrFor = null; // null: closed, "": everyone, or a team id
function renderQrCard() {
  const el = $("qrCard");
  el.hidden = screenMode || qrFor === null || view !== "trainer" || !eventId || !eventId.startsWith(today());
  if (el.hidden) return;
  const t = state.teams.find(t => t.id === qrFor);
  if (qrFor && !t) qrFor = "";
  const url = baseUrl() + (t ? "?team=" + t.id : "");
  const stamp = url + "|" + state.teams.map(t => t.id + t.name).join();
  if (el.dataset.stamp === stamp) return;
  el.dataset.stamp = stamp;
  el.innerHTML = `
    <div class="live-top"><h2>Join by QR code</h2><button class="ghost" id="qrClose">Close</button></div>
    <div class="qr-pick">${[["", "Everyone"], ...state.teams.map(t => [t.id, t.name])].map(([id, n]) =>
      `<button data-qr="${id}" aria-pressed="${(t ? t.id : "") === id}">${esc(n)}</button>`).join("")}</div>
    <div class="qr big" id="qrBox"></div>
    <p class="note center">${t ? `Scan to score for <b>${esc(t.name)}</b>. The phone remembers the team every week.` : "Scan to join today's session, then pick your team."}</p>`;
  drawQR($("qrBox"), url);
}

// ---- Big screen ----
// ?screen shows today's standings large for a TV or laptop, with the clock and a QR code to join.
// It follows the live session like a team phone but can't change anything.
// A thin bar under an EMOM's minutes on the big screen: done, missed, still to come.
function gridBar(s, t) {
  if (s.measure !== "done") return "";
  const cells = roundList().flatMap(r => [...Array(s.minutes)].map((_, k) => val(t, r, `${s.id}_m${k + 1}`)));
  return `<span class="gbar">${cells.map(x => `<i class="${x === 1 ? "ok" : x === 2 ? "miss" : ""}"></i>`).join("")}</span>`;
}
function renderScreen() {
  const el = $("screen");
  document.body.classList.toggle("screen", screenMode);
  el.hidden = !screenMode;
  if (!screenMode) return;
  if (view !== "screen" && view !== "local") {
    el.innerHTML = `<div class="scr-title">${esc(W.name)}</div>
      <p class="scr-sub">${view === "missing" ? "Today's session hasn't started yet. This screen switches to it by itself." : view === "error" ? esc(liveMsg) : "Connecting…"}</p>`;
    return;
  }
  const { rk, rows, n } = table(W, state.teams), one = n === 1, any = anyScores() && n > 0;
  const sub = [eventId ? eventLabel(eventId) : "", W.rounds > 1 && timed() ? "Runde " + (state.round + 1) : "", connected ? "" : "offline, will catch up"].filter(Boolean).join(" · ");
  el.innerHTML = `
    <div class="scr-head"><div><div class="scr-title">${esc(W.name)}</div><div class="scr-sub">${esc(sub)}</div></div>
      ${timed() ? `<div class="scr-clock" data-clock>${clockText()}</div>` : ""}</div>
    <div class="scr-main">
      <div class="tbl-wrap"><table class="scr-tbl">
        <thead><tr><th></th><th>Team</th>${W.stations.map(s => `<th>${esc(s.name)}<br>${esc(unitOf(s))}</th>`).join("")}${n > 1 ? "<th>Points</th>" : ""}</tr></thead>
        <tbody>${rows.map(({ t, i, pts, place }) => `
          <tr class="${any && place === 1 ? "lead" : ""}"><td class="place">${any ? place : ""}</td>

    el.innerHTML = FIREBASE_CONFIG ? `
      <div class="live-top"><h2>Team phones</h2><a class="solid" href="${baseUrl()}">Back to live scoring</a></div>
      <p class="note">This phone is counting on its own. Nothing here is shared.</p>` : "";
  } else if (view === "trainer" && !eventId.startsWith(today())) {
    el.innerHTML = `
      <div class="live-top">${label} ${eventId.slice(0, 4)}${conn}</div>
      <p class="note">Past session, open only on your phone. Pick each team with the tabs below and type in its numbers${W.rounds > 1 ? " for every round" : ""}. The teams' phones aren't affected.</p>
      <div class="actions"><a class="solid" href="${baseUrl()}">Back to today</a></div>${msg}`;
  } else if (view === "trainer") {
    el.innerHTML = `
      <div class="live-top">${label}${conn}</div>
      <p class="note">Teams scan the QR code and pick their team once; their phone remembers it every week. You can fix any team's numbers below.</p>
      <div class="actions"><button class="solid" id="qrOpen">Show QR codes</button>
        <a class="ghost" href="${baseUrl()}?screen" target="_blank" rel="noopener">Open big screen</a>
        ${forcedEvent ? `<a class="ghost" href="${baseUrl()}">Back to today</a>` : ""}</div>${msg}`;
  } else if (view === "team") {
    el.setAttribute("style", tc(state.active));
    el.innerHTML = `
      <div class="live-top"><span>Scoring for <b>${esc(state.teams[state.active].name)}</b></span>${conn}</div>
      <div class="actions"><span class="note">Session ${esc(eventLabel(eventId))}</span><button class="ghost" data-role="">Switch team</button></div>${msg}`;
  } else if (view === "pick") {
    el.innerHTML = `<div class="live-top">${label}${conn}</div>${msg}`;
  } else if (view === "wait") {
    el.innerHTML = `<p class="note">Joining ${eventId ? "session " + esc(eventLabel(eventId)) : "today's session"}…</p>`;
  } else if (view === "missing" && !forcedEvent) {
    el.innerHTML = `
      <div class="live-top"><h2>Today's session hasn't started</h2>${conn}</div>
      <p class="note">This page updates by itself as soon as the trainer starts it. Trainer: pick the workout and start it here. The teams from last time carry over.</p>
      <div class="actions"><select class="date" id="startPick" aria-label="Workout for today">${workoutOptions(startPick)}</select>
        <button class="solid" id="startToday">Start today's session</button>
        <a class="ghost" href="${baseUrl()}?local">Use this phone on its own</a></div>
      ${msg}`;
  } else {
    el.innerHTML = `
      <h2>${view === "missing" ? "Session not found" : "Live scoring unavailable"}</h2>
      <p class="note">${view === "missing" ? "There's no session for that date." : esc(liveMsg)}</p>
      <div class="actions"><a class="ghost" href="${baseUrl()}">Go to today's session</a><a class="ghost" href="${baseUrl()}?local">Use this phone on its own</a></div>`;
  }
  el.hidden = !el.innerHTML.trim();
  renderLinks();
}

// Trainer tools: links for anyone who can't scan the QR code, an extra session, and switching role.
function renderLinks() {
  const el = $("linksCard");
  el.hidden = screenMode || view !== "trainer" || !eventId.startsWith(today());
  if (el.hidden) return;
  el.innerHTML = `
    <h2>Links</h2>
    <p class="note">For anyone who can't scan the QR code. A team's own link sets its phone to that team.</p>
    ${state.teams.map((t, i) => `<div class="link-row" style="${tc(i)}"><span class="dot"></span><span class="n">${esc(t.name)}</span>
      <button class="ghost" data-share="${t.id}" data-label="Send link">Send link</button></div>`).join("")}
    <div class="actions"><button class="ghost" data-share="" data-label="Send link for everyone">Send link for everyone</button>
      <button class="ghost" id="screenShare" data-label="Send big-screen link">Send big-screen link</button></div>
    <h3 class="sub">This phone</h3>
    <div class="actions"><button class="ghost" id="startExtra">Start extra session</button>
      <button class="ghost" data-role="">Switch role</button></div>`;
}

// Trainer only: today's sessions (switch every phone), past sessions (open on this phone), and adding a past one.
function renderSessions() {
  const el = $("sessionsCard");
  el.hidden = screenMode || !(live && getRole() === "trainer" && (view === "trainer" || view === "missing"));
  if (el.hidden) return;
  const t = today(), list = sessionList || [];
  const todays = list.filter(id => id.startsWith(t)), past = list.filter(id => !id.startsWith(t));
  const row = (id, action) => `<div class="link-row"><span class="n">${esc(eventLabel(id))}${id.startsWith(t) ? "" : " " + id.slice(0, 4)}</span>${action}</div>`;
  const onScreen = `<span class="note">On screen</span>`;
  el.innerHTML = `
    <h2>Sessions</h2>
    ${sessionList === null ? `<p class="note">Loading…</p>` : `
    <h3 class="sub">Today</h3>
    ${todays.length ? todays.map(id => row(id, id === latest ? `<span class="note">Live now</span>` : `<button class="ghost" data-switch="${id}">Switch everyone here</button>`)).join("") : `<p class="note">No session yet today.</p>`}
    <h3 class="sub">Past sessions</h3>
    ${past.length ? past.map(id => row(id, id === eventId ? onScreen : `<button class="ghost" data-open="${id}">Open</button>`)).join("") : `<p class="note">None yet.</p>`}`}
    <h3 class="sub">Add a past session</h3>
    <p class="note">For results on paper. Pick the date, then type each team's numbers in. It opens only on your phone; the teams' phones stay where they are.</p>
    <div class="actions"><input type="date" id="pastDate" min="${FIRST_DAY}" max="${t}" class="date"><button class="solid" id="addPast">Add</button><span class="msg" id="pastMsg"></span></div>
    ${view === "trainer" ? `<h3 class="sub">Session on screen · ${esc(eventLabel(eventId))}</h3>
    <span id="delArea"><button class="ghost danger" id="delSession">Delete this session</button></span>` : ""}`;
}

function renderPicker() {
  $("pickList").innerHTML = state.teams.map((t, i) =>
    `<button style="${tc(i)}" data-role="${t.id}"><span class="dot"></span>${esc(t.name)}</button>`).join("");
}

function renderSections() {
  if (screenMode) {
    for (const id of ["roundSeg", "board", "teams", "tools", "standCard", "picker"]) $(id).hidden = true;
    return;
  }
  const scoring = ["local", "trainer", "team"].includes(view);
  $("roundSeg").hidden = !scoring || W.rounds < 2;
  $("board").hidden = !scoring;
  $("teams").hidden = $("setupCard").hidden = !(view === "local" || view === "trainer");
  $("standCard").hidden = !(scoring || view === "pick");
  $("picker").hidden = view !== "pick";
  $("tools").hidden = !(view === "local" || view === "trainer" || (view === "missing" && live && getRole() === "trainer"));
  $("toolsLabel").textContent = view === "local" ? "Workouts and teams" : "Trainer tools";
}

function renderAll() { renderHeader(); renderRound(); renderTeams(); renderBoard(); renderStandings(); renderLive(); renderPicker(); renderSections(); renderSessions(); renderWorkout(); renderHistory(); renderQrCard(); renderScreen(); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.round) { state.round = +b.dataset.round; editing = null; }
  else if (b.dataset.team) { state.active = +b.dataset.team; editing = null; }
  else if (b.dataset.k) {
    bump(state.active, b.dataset.k, +b.dataset.d);
    if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
  }
  else if (b.dataset.act) { const [act, sid] = b.dataset.act.split(":"); stationAction(state.active, act, sid); }
  else if (b.dataset.min) {
    const [sid, m] = b.dataset.min.split(":"), s = W.stations.find(s => s.id === sid);
    if (s.measure === "done") {
      const key = `${sid}_m${m}`, x = val(state.teams[state.active], state.round, key);
      setValue(state.active, key, !clockStart(state.round) ? (x + 1) % 3 : x === 2 ? (minutesPassed(s) >= +m ? 1 : 0) : 2);
    }
    else { emomSel[sid] = +m; editing = null; }
  }
  else if (b.dataset.edit) { editing = b.dataset.edit; renderBoard(); return; }
  else if (b.dataset.remove) { removeTeam(+b.dataset.remove); renderSetup(); }
  else if (b.dataset.role !== undefined) {
    setRole(b.dataset.role); editing = null;
    const i = state.teams.findIndex(t => t.id === b.dataset.role);
    view = b.dataset.role === "trainer" ? "trainer" : i >= 0 ? "team" : "pick";
    if (i >= 0) state.active = i;
    window.scrollTo(0, 0); renderSetup();
  }
  else if (b.dataset.share !== undefined) {
    return share(baseUrl() + (b.dataset.share ? "?team=" + b.dataset.share : ""), b);
  }
  else if (b.dataset.qr !== undefined) { qrFor = b.dataset.qr; return renderQrCard(); }
  else if (b.id === "qrOpen") { qrFor = ""; renderQrCard(); $("qrCard").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  else if (b.id === "qrClose") { qrFor = null; return renderQrCard(); }
  else if (b.id === "screenShare") return share(baseUrl() + "?screen", b);
  else if (b.dataset.switch) return switchSession(b.dataset.switch);
  else if (b.dataset.open) { location.href = baseUrl() + "?e=" + b.dataset.open; return; }
  else if (b.id === "addPast") return addPastSession($("pastDate").value, b);
  else if (b.id === "clockStart") startClock();
  else if (b.id === "clockReset") {
    $("clockArea").innerHTML = `<span class="confirm">Reset the clock? <button class="solid-danger" id="clockYes">Reset</button><button class="ghost" id="clockNo">Cancel</button></span>`;
    return;
  }
  else if (b.id === "clockYes") resetClock();
  else if (b.id === "clockNo") { renderBoard(); return; }
  else if (b.dataset.wuse) {
    const w = byId(b.dataset.wuse); if (!w) return;
    wMsg = "";
    if (anyScores()) { wConfirm = { kind: "use", id: w.id }; return renderWorkout(true); }
    useWorkout(w);
  }
  else if (b.id === "wUseYes") { wConfirm = null; useWorkout(byId(b.dataset.w)); }
  else if (b.id === "wDelYes") { wConfirm = null; deleteWorkout(b.dataset.w); return renderWorkout(true); }
  else if (b.id === "wNo") { wConfirm = null; return renderWorkout(true); }
  else if (b.dataset.wdel) { wConfirm = { kind: "del", id: b.dataset.wdel }; return renderWorkout(true); }
  else if (b.dataset.wcopy) return copyText(JSON.stringify(byId(b.dataset.wcopy), null, 2), b);
  else if (b.id === "wPrompt") return copyText(LLM_PROMPT, b);
  else if (b.id === "wCheck") { pasteText = $("wPaste").value; pasteCheck = checkWorkout(pasteText); wMsg = ""; return renderWorkout(true); }
  else if (b.id === "wSave") return saveChecked(b);
  else if (b.id === "delSession") {
    $("delArea").innerHTML = `<span class="confirm">Delete ${esc(eventLabel(eventId))} and all its scores? This can't be undone. <button class="solid-danger" id="delYes">Delete</button><button class="ghost" id="delNo">Cancel</button></span>`;
    return;
  }
  else if (b.id === "delYes") return deleteSession();
  else if (b.id === "delNo") { renderSessions(); return; }
  else if (b.id === "startToday" || b.id === "startExtra") return startEvent(b, b.id === "startExtra");
  else if (b.id === "addTeam") { addTeam(); renderSetup(); }
  else if (b.id === "reset") {
    $("resetArea").innerHTML = `<span class="confirm">Clear every count for all teams? <button class="solid-danger" id="resetYes">Reset</button><button class="ghost" id="resetNo">Cancel</button></span>`;
    return;
  }
  else if (b.id === "resetYes" || b.id === "resetNo") {
    if (b.id === "resetYes") resetAll();
    $("resetArea").innerHTML = `<button class="ghost danger" id="reset">Reset all counts</button>`;
  }
  else return;
  save(); renderAll();
});

document.addEventListener("change", e => {
  if (e.target.id === "startPick") startPick = e.target.value;
});

document.addEventListener("input", e => {
  // Editing the pasted text means it has to be checked again before saving.
  if (e.target.id === "wPaste") { pasteText = e.target.value; if (pasteCheck) { pasteCheck = null; $("wSave")?.remove(); } return; }
  const i = e.target.dataset.name; if (i === undefined) return;
  rename(+i, e.target.value.trim() || "Team " + (+i + 1));
  save(); renderTeams(); renderBoard(); renderStandings(); renderLive();
});

// Keep the screen awake while counting, where the browser allows it.
async function wake() { try { if (navigator.wakeLock && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); } catch {} }
document.addEventListener("visibilitychange", wake);
wake();

renderSetup(); renderAll();
if (view !== "local") initLive();
</script>
</body></html>
