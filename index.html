<style>
/* Layout: one-column phone scoreboard. Header + round switch, team tabs, 2x2 station counters, standings table, team setup. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --fg: #16191a;
  --muted: #5f6763;
  --line: #d3d8d3;
  --accent: #1f6feb;
  --accent-fg: #ffffff;
  --press: #e3e7e2;
  --danger: #c2321f;
  --go: #e8457a; /* big screen when work starts: pink-red, against the teal rest colour */
  --t1: #1f6feb; --t2: #d9480f; --t3: #2b8a3e; --t4: #9c36b5; --t5: #c08a00; --t6: #0c8599;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111413; --surface: #1b1f1e; --fg: #eef1ee; --muted: #9aa39f; --line: #2c3331;
  --accent: #5b9dff; --accent-fg: #0b1220; --press: #262c2a; --danger: #ff6b55; --go: #f0507f;
  --t1: #5b9dff; --t2: #ff8a4c; --t3: #5fcf75; --t4: #d27ff0; --t5: #f2c230; --t6: #3fc7dc;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111413; --surface: #1b1f1e; --fg: #eef1ee; --muted: #9aa39f; --line: #2c3331;
  --accent: #5b9dff; --accent-fg: #0b1220; --press: #262c2a; --danger: #ff6b55; --go: #f0507f;
  --t1: #5b9dff; --t2: #ff8a4c; --t3: #5fcf75; --t4: #d27ff0; --t5: #f2c230; --t6: #3fc7dc;
  color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; margin: 0; letter-spacing: .01em; text-transform: uppercase; }
h1 small { display: block; font-family: var(--body); font-weight: 600; font-size: .75rem; letter-spacing: .08em; color: var(--muted); margin-top: 4px; }
h2 { font-family: var(--display); font-weight: 800; font-size: 1.3rem; text-transform: uppercase; letter-spacing: .03em; margin: 0; }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { font-family: var(--display); font-weight: 800; font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase; padding: 8px 16px; border-radius: 999px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.teams { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.teams button { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; }
.teams button .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tc); }
.teams button[aria-pressed="true"] { border-color: var(--tc); box-shadow: inset 0 0 0 1px var(--tc); }

.board { border-top: 6px solid var(--tc); background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.board-head .name { font-family: var(--display); font-weight: 800; font-size: 1.5rem; text-transform: uppercase; }
.board-head .rnd { color: var(--muted); font-size: .85rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }

.st { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.st-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.st-name { font-weight: 600; font-size: .9rem; }
.st-unit { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.st-info { font-size: .72rem; color: var(--muted); margin-top: -6px; }
.st-val { font-family: var(--display); font-weight: 800; font-size: 3.2rem; line-height: .95; font-variant-numeric: tabular-nums; text-align: center; width: 100%; padding: 2px 0; border-radius: 8px; }
.st-val:active { background: var(--press); }
.st-input { font-family: var(--display); font-weight: 800; font-size: 2.6rem; text-align: center; width: 100%; border: 2px solid var(--accent); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 2px 0; }
/* Side-by-side tiles: the number and buttons sit at the same height even when a name or info line wraps. */
.st:not(.wide) > .st-val, .st:not(.wide) > .st-input { margin-top: auto; }
.st-other { text-align: center; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.btns button { padding: 12px 0; border-radius: 10px; background: var(--press); font-family: var(--display); font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.btns button.plus { background: var(--tc); color: var(--accent-fg); }
.btns button:active { transform: scale(.96); }
.minus-row { display: flex; justify-content: center; }
.minus-row button { font-size: .8rem; color: var(--muted); padding: 4px 10px; border-radius: 8px; }
.minus-row button:active { background: var(--press); }

.card { background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.tools > summary { background: var(--surface); border-radius: 14px; padding: 14px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.tools > summary::-webkit-details-marker { display: none; }
.tools > summary::after { content: "Show"; font-size: .8rem; font-weight: 600; color: var(--muted); }
.tools[open] > summary::after { content: "Hide"; }
.tools > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.guide h3 { font-size: 1rem; margin: 8px 0 0; }
.guide p, .guide li { font-size: .9rem; line-height: 1.45; margin: 0; }
.guide ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.tools-body { display: flex; flex-direction: column; gap: 18px; margin-top: 18px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .9rem; }
th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td .rk { display: block; font-size: .7rem; color: var(--muted); }
td.pts { font-family: var(--display); font-weight: 800; font-size: 1.2rem; }
tr.lead td.pts { color: var(--accent); }
#standings th:first-child, #standings td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); max-width: 9.5em; overflow: hidden; text-overflow: ellipsis; }
#standings td.pts { text-align: center; }
.tname { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.tname .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); }
.note { font-size: .8rem; color: var(--muted); margin: 0; line-height: 1.45; }

.setup-row { display: flex; gap: 8px; align-items: center; }
.setup-row input { flex: 1; min-width: 0; font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.setup-row select.size { font: inherit; padding: 9px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); flex: none; }
td .avg { display: block; font-size: .7rem; color: var(--muted); white-space: nowrap; }
.scr-tbl .avg { font-size: .45em; }
.setup-row .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--tc); flex: 0 0 auto; }
.ghost { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); font-weight: 600; font-size: .9rem; }
.linkish { font-size: .8rem; color: var(--muted); text-decoration: underline; padding: 6px 0; }
.start-row { flex-wrap: wrap; }
.start-row.free .n { color: var(--muted); }
.start-teams { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; flex: 1; justify-content: flex-end; }
.trainer-entry { margin-top: 14px; text-align: right; }
.ghost.danger { color: var(--danger); border-color: var(--danger); }
.solid-danger { padding: 9px 12px; border-radius: 8px; background: var(--danger); color: var(--surface); font-weight: 600; font-size: .9rem; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
@media (prefers-reduced-motion: reduce) { .btns button:active { transform: none; } }
.live { border-left: 6px solid var(--tc, var(--accent)); }
.live-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.code { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: .12em; }
.lock-title { font-weight: 600; font-size: .9rem; }
.lock-title::before { content: "🔒 "; }
/* Shows how long the screen stays on without a tap. It empties and never counts down in numbers, so it can't be taken for the workout clock. */
.lock-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 8px 0 6px; }
.lock-bar span { display: block; height: 100%; width: 100%; background: var(--tc, var(--t1)); transition: width 1s linear; }
.lock-bar.on span { transition: none; }
.team-foot { justify-content: space-between; margin: 4px 0 16px; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--t3); }
.conn.off::before { background: var(--danger); }
.solid { padding: 11px 14px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick button { padding: 18px 10px; border-radius: 12px; border: 2px solid var(--tc); background: var(--surface); font-family: var(--display); font-weight: 800; font-size: 1.3rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; }
.pick .dot, .link-row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tc); flex: 0 0 auto; }
.link-row { display: flex; align-items: center; gap: 8px; }
.link-row span.n { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.ghost, a.solid { color: inherit; text-decoration: none; display: inline-block; }
a.solid { color: var(--accent-fg); }
h3.sub { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.date { font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
[hidden] { display: none !important; }
/* v2: wide stations, clock, AMRAP pair, EMOM minute grid, workout card */
.st.wide { grid-column: 1 / -1; }
.btns.two { grid-template-columns: 1fr 1fr; }
.btns.one { grid-template-columns: 1fr; }
.btns button:disabled { opacity: .4; cursor: default; transform: none; }
.center { text-align: center; justify-content: center; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.clockbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.clock-val { font-family: var(--display); font-weight: 800; font-size: 2rem; font-variant-numeric: tabular-nums; line-height: 1; }
.clock-in { width: 7ch; font-size: 1.8rem; }
.nownext { border-radius: 10px; background: var(--press); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.nn-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.nn-row b { font-size: 1.15rem; flex: 1; min-width: 0; }
.nn-row.next { color: var(--muted); font-size: .9rem; }
.nn-l { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); width: 3.2em; flex: none; }
.nn-t { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.st.cur { border: 2px solid var(--tc); padding: 9px; }
.nownext.rot { border-left: 4px solid var(--tc, var(--accent)); }
.nownext.flash, .clock-val.flash, .scr-clock.flash { animation: flash 1.2s ease-out 2; }
.clock-val.flash, .scr-clock.flash { border-radius: 8px; }
@keyframes flash { 0% { background: var(--tc, var(--accent)); color: var(--accent-fg); } 100% { background: var(--press); } }
@media (prefers-reduced-motion: reduce) { .nownext.flash, .clock-val.flash, .scr-clock.flash { animation: none; outline: 3px solid var(--tc, var(--accent)); } }
.rot-board { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.rot-head { font-family: var(--display); font-weight: 800; font-size: clamp(1.4rem, 3vw, 3rem); }
.rot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.rot-cell { background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 80px; opacity: .6; }
.rot-cell.busy { opacity: 1; }
.scr-clock-l { display: block; font-size: .18em; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; }
.rot-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.strip-cell { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.lanes { display: grid; gap: 6px; align-items: stretch; }
.lane-h { font-family: var(--display); font-weight: 800; color: var(--muted); font-size: clamp(.8rem, 1.2vw, 1.2rem); padding: 0 4px; }
.lane-t { display: flex; align-items: center; font-size: clamp(.9rem, 1.4vw, 1.4rem); }
.lane-c { background: color-mix(in srgb, var(--tc) 18%, var(--surface)); border-left: 4px solid var(--tc); border-radius: 8px; padding: 8px 6px; font-weight: 700; font-size: clamp(.7rem, 1.2vw, 1.3rem); overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 2px; }
.lane-c small { font-weight: 600; color: var(--muted); font-size: .75em; }
.strip-cell.moving { outline: 3px solid var(--accent); background: color-mix(in srgb, var(--t6) 22%, var(--surface)); }
.strip-cell b { font-size: clamp(1rem, 1.6vw, 1.5rem); }
.strip-cell .tname { font-size: clamp(.9rem, 1.4vw, 1.3rem); }
.strip-t { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 5vw, 5rem); font-variant-numeric: tabular-nums; line-height: 1; }
.strip-t small { font-size: .35em; color: var(--muted); font-weight: 700; }
.rot-cell.moving { outline: 3px solid var(--accent); }
.rot-cell b { font-size: clamp(.9rem, 1.4vw, 1.3rem); }
.rot-cell .tname { font-size: clamp(.9rem, 1.4vw, 1.4rem); }
.rot-cell i { font-style: normal; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.nownext.big { padding: 14px 20px; gap: 8px; margin-bottom: 18px; }
.nownext.big .nn-row b { font-size: clamp(1.6rem, 4vw, 4rem); }
.nownext.big .nn-t { font-size: clamp(1.6rem, 4vw, 4rem); }
.nownext.big .nn-row.next { font-size: clamp(1.1rem, 2.4vw, 2.4rem); }
.nownext.big .nn-l { font-size: clamp(.8rem, 1.4vw, 1.3rem); }
/* Big view on a team phone: the clock, where you are and where you go next, readable from a few metres away. */
.bigbtn { margin-left: auto; }
#bigView { display: none; }
body.bigview #bigView { display: flex; }
body.bigview .wrap > :not(#bigView) { display: none !important; }
body.bigview .wrap { max-width: none; min-height: 100dvh; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-sizing: border-box; }
#bigView { flex: 1; flex-direction: column; gap: 3vh; border-top: 8px solid var(--tc); padding: 2vh 4px 4px; }
#bigView.rest { background: color-mix(in srgb, var(--t6) 22%, var(--bg)); padding-inline: 12px; border-radius: 0 0 14px 14px; }
.bv-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--display); font-weight: 800; text-transform: uppercase; }
.bv-team { font-size: clamp(1.4rem, 7vw, 2.6rem); line-height: 1; overflow-wrap: anywhere; }
.bv-rnd { color: var(--muted); font-size: clamp(1rem, 4.5vw, 1.6rem); white-space: nowrap; }
.bv-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 3vh; }
.bv-l { display: block; font-size: clamp(.9rem, 4vw, 1.4rem); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.bv-clock { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; line-height: .85; font-size: clamp(4.5rem, min(44vw, 28vh), 18rem); }
.bv-clock.mid { font-size: clamp(4rem, min(35vw, 24vh), 15rem); }
.bv-clock.small { font-size: clamp(3rem, min(18vw, 14vh), 9rem); }
.bv-now { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .95; font-size: clamp(2.4rem, min(16vw, 11vh), 8rem); overflow-wrap: anywhere; }
.bv-now small { display: block; font-size: .45em; color: var(--muted); margin-top: .15em; }
.bv-next { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: 1; font-size: clamp(1.6rem, min(10vw, 7vh), 5rem); color: var(--muted); overflow-wrap: anywhere; }
.bv-next b { color: var(--fg); }
#bigView.flash .bv-now { animation: flash 1.2s ease-out 2; border-radius: 8px; }
.bv-lock .lock-bar { margin: 6px 0 0; }
.bv-back { width: 100%; padding: 16px; font-size: 1.1rem; }
@media (orientation: landscape) and (max-height: 500px) {
  .bv-body { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 6vw; }
  .bv-clock, .bv-clock.mid { font-size: min(34vh, 24vw); grid-row: span 2; }
}
@media (prefers-reduced-motion: reduce) { #bigView.flash .bv-now { animation: none; outline: 3px solid var(--tc, var(--accent)); } }
.mins { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.mins button { border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.mins b { font-size: .7rem; color: var(--muted); font-weight: 600; }
.mins span { font-size: .68rem; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mins i { font-style: normal; font-family: var(--display); font-weight: 800; font-size: 1.35rem; font-variant-numeric: tabular-nums; min-height: 1.35em; }
.mins button.sel { border: 2px solid var(--tc); }
.mins button.now { background: var(--press); }
.mins button.ok i { color: var(--t3); }
.mins button.miss i { color: var(--danger); }
.mins button.later { opacity: .55; }
.gbar { display: flex; gap: 2px; margin-top: 4px; }
.gbar i { flex: 1; height: 6px; min-width: 2px; border-radius: 2px; background: var(--line); }
.gbar i.ok { background: var(--t3); }
.gbar i.miss { background: var(--danger); }
.min-panel { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
select.date { max-width: 100%; }
/* Workout list and paste box */
.w-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.w-row .n { flex: 1 1 200px; min-width: 0; }

// Starts today's session, or an extra one the same day, with the teams from the last session this phone

async function startEvent(btn, extra) {
  btn.disabled = true; btn.textContent = "Starting…";

    if (extra) for (let n = 2; ; n++) {
      if (n > MAX_PER_DAY) throw new Error("full");
      id = `${today()}-${n}`; if (!(await live.fb.get(live.fb.ref(live.db, "events/" + id))).exists()) break;
    }
    setRole("trainer");
    await live.fb.update(live.fb.ref(live.db), { ["events/" + id]: newSession(byId(startPick) || DEFAULT), current: id });
    sessionList = null; loadSessions();

// A burst of glitter over the whole screen. Secret: tap the workout title five times quickly.
// It also goes off by itself for a PB, a record or a reached team goal (a team phone only for its own team).
const GLITTER = ["#ffd43b", "#ff6bcb", "#5b9dff", "#5fcf75", "#ffffff", "#d27ff0", "#ff8a4c", "#3fc7dc"];
function glitter(message = "", big = false) {

    m.className = "glitter-msg"; m.textContent = message;

  const c = document.createElement("canvas"), dpr = devicePixelRatio || 1;
  c.className = "glitter"; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  document.body.append(c);

  const parts = Array.from({ length: big ? 280 : 150 }, (_, i) => {
    // Half rain down from the top, half burst out from the middle.
    const burst = i % 2, a = Math.random() * Math.PI * 2, v = (3 + Math.random() * 9) * dpr;
    return {
      x: burst ? w / 2 : Math.random() * w, y: burst ? h * .42 : -Math.random() * h * .4,
      vx: burst ? Math.cos(a) * v : (Math.random() - .5) * 2 * dpr, vy: burst ? Math.sin(a) * v - 4 * dpr : (2 + Math.random() * 4) * dpr,
      s: (3 + Math.random() * 5) * dpr, c: GLITTER[i % GLITTER.length], r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    };

    const t = now - t0;
    g.clearRect(0, 0, w, h);
    for (const p of parts) {
      p.vx *= .985; p.vy = p.vy * .985 + .12 * dpr; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r);

}

THE FORMAT
{

  "name": "Name shown in the app",
  "place": "Thursday Athletic",
  "teams": 4,
  "teamSize": 3,
  "rounds": 1,
  "stations": [ ...one object per scored part... ]

- id: lowercase letters, digits and dashes, max 20 characters, for example "teamwork-okt". Never one of: ${LIBRARY.map(w => w.id).join(", ")}. If you were given an existing workout to change, keep its id.
- name (max 40 characters) and place (optional, max 40).
- teams (1-12) and teamSize (1-20): from the workout. If it doesn't say, use 4 and 3.
- rounds (1-10): how often the WHOLE list of stations is repeated, with each repeat scored as its own round (like "Runde 1" and "Runde 2"). Almost always 1. Rounds that are part of one piece ("4 rounds for time", "5 Runden", "3 rounds of the EMOM") are NOT rounds here: they belong to that station, inside its info, totalReps or minutes.

STATIONS
A station is one part that is scored separately. Leave out warm-ups, rest and anything not scored. Every station has:
- "id": 1-8 lowercase letters or digits only, unique in the workout, e.g. "erg", "wb", "partb"
- "name": short, max 30 characters
- "type": one of the four types below
- "info": one line with what to do, max 120 characters, e.g. "4 rounds: 400 m run · 20 lunges · 15 KB swings"
- "steps": three whole numbers for the + buttons: [1, 5, 10] for reps or cals, [10, 50, 100] for meters, [1, 2, 5] for small counts like lanes
Use the workout's language for name, info and moves.

TYPES
- "count": max effort, the team counts what it did (reps, cals, meters, lanes). Add "unit", max 12 characters, e.g. "reps", "cals", "meters".
- "time": for time, fastest wins. Add "cap" if there is a time cap, always written "mm:ss", e.g. "18:00". Add "totalReps" if all work of the piece is reps or cals that can be added up (rounds times reps per round).

    if (c !== null && !(c >= 10 && c <= 3600)) errors.push('timer must be from "0:10" to "60:00", or true for a clock that counts up.');
  }
  if (o.timer !== undefined && o.slot !== undefined) warnings.push('The workout has a "slot", so "timer" is ignored: the rotation has its own clock.');
  if (o.rounds !== undefined && !(Number.isInteger(+o.rounds) && o.rounds >= 1 && o.rounds <= 10)) errors.push("rounds must be a whole number from 1 to 10.");
  if (!Array.isArray(o.stations) || !o.stations.length) errors.push("The workout needs at least one station.");
  else {
    const seen = new Set();
    o.stations.forEach((s, i) => {
      const n = `Station ${i + 1}${s && s.name ? ` (${s.name})` : ""}`;
      if (!s || typeof s !== "object") return errors.push(`${n} isn't valid.`);
      // Station ids are only used inside the app, so any name will do once it fits.
      let sid = String(s.id || s.name || "st").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8) || "st";
      for (let k = 2; seen.has(sid); k++) sid = sid.slice(0, 7) + k;
      s.id = sid; seen.add(sid);
      if (typeof s.type === "string") s.type = s.type.toLowerCase();
      if (!TYPES[s.type || "count"]) errors.push(`${n}: the type must be count, time, amrap or emom.`);
      if (s.type === "emom" && !(Number.isInteger(+s.minutes) && s.minutes >= 1 && s.minutes <= 60)) errors.push(`${n}: minutes must be a whole number from 1 to 60.`);
      if ((s.type === "time" || s.type === "amrap") && s.cap !== undefined) {
        mss(s.cap, `${n}: cap`, "20:00");
      }
      const slot = typeof o.slot === "string" ? parseTime(o.slot) || 0 : 0;
      if (s.time !== undefined) {
        if (o.slot === undefined) warnings.push(`${n} has a time but the workout has no "slot", so it's ignored.`);
        else { const c = mss(s.time, `${n}: time`, "5:00");
          if (c !== null && c < 10) errors.push(`${n}: time must be at least "0:10".`);
          else if (c !== null && slot && c > slot) errors.push(`${n}: its time (${fmt(c)}) is longer than the slot (${fmt(slot)}).`); }
      }
      if (s.work !== undefined || s.switch !== undefined) {
        if (o.slot === undefined) warnings.push(`${n} has "work" but the workout has no "slot", so it's ignored.`);
        else {
          const c = mss(s.work, `${n}: work`, "1:30"), sw = s.switch === undefined ? 0 : mss(s.switch, `${n}: switch`, "0:30");
          const len = Math.min(slot || Infinity, typeof s.time === "string" ? parseTime(s.time) || Infinity : Infinity);
          if (c === null || sw === null) {}
          else if (c < 5) errors.push(`${n}: work must be at least "0:05".`);
          else if (sw > 600) errors.push(`${n}: switch is ${fmt(sw)}. It's the time to change machines, like "0:30".`);
          else if (len < Infinity && c + sw > len) warnings.push(`${n}: ${fmt(c)} work + ${fmt(sw)} switch is longer than its ${fmt(len)}, so there's only one part.`);
          else if (sw > c) warnings.push(`${n}: the switch (${fmt(sw)}) is longer than the work (${fmt(c)}). Is that right?`);
        }
      }
      if (s.type === "amrap" && !s.cap) warnings.push(`${n} has no length. Add a cap like "20:00" so the clock counts down.`);
    });
    if (o.rounds > 1 && o.stations.some(s => s && s.type && s.type !== "count"))
      warnings.push(`rounds is ${o.rounds}, so every station is done ${o.rounds} times and scored per round. If the rounds belong to one part ("${o.rounds} rounds for time"), ask the chatbot to set rounds to 1.`);
  }
  if (errors.length) return { errors };
  const w = normWorkout(o);
  if (!w) return { errors: ["The workout couldn't be read."] };
  if (JSON.stringify(w).length > 6000) return { errors: ["The workout is too long to save. Shorten the info lines or moves."] };
  return { w, errors: [], fixed, warnings };
}

function persistSaved() {
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(Object.fromEntries(Object.entries(saved).map(([id, w]) => [id, JSON.stringify(w)])))); } catch {}
}
async function storeWorkout(w) {
  if (live) return live.fb.set(live.fb.ref(live.db, "workouts/" + w.id), JSON.stringify(w));
  saved[w.id] = w; persistSaved();
}
function deleteWorkout(id) {
  if (live) return live.fb.set(live.fb.ref(live.db, "workouts/" + id), null).catch(() => {});
  delete saved[id]; persistSaved();
}
async function saveChecked(btn) {
  const w = pasteCheck && pasteCheck.w; if (!w) return;
  btn.disabled = true;
  try { await storeWorkout(w); wMsg = `Saved ${w.name}. Tap Use next to it to switch to it.`; pasteText = ""; pasteCheck = null; }
  catch { wMsg = "Couldn't save it. Check the connection and try again."; }
  renderWorkout(true);
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch { btn.textContent = "Couldn't copy"; }
  setTimeout(() => btn.textContent = btn.dataset.label, 1500);
}
const workoutOptions = sel => [...LIBRARY, ...savedList()].map(w => `<option value="${esc(w.id)}" ${w.id === sel ? "selected" : ""}>${esc(w.name)}</option>`).join("");

function renderWorkout(force) {

  el.hidden = !(view === "local" || trainerOn());
  if (el.hidden || (!force && el.contains(a) && a.tagName === "TEXTAREA")) return;
  const row = (w, own) => {
    const c = wConfirm && wConfirm.id === w.id ? wConfirm.kind : "";
    return `<div class="w-row"><div class="n"><b>${esc(w.name)}</b><span>${esc(summary(w))}</span></div>
      <div class="actions">${sameWorkout(w, W) ? `<span class="note">In use</span>` : `<button class="ghost" data-wuse="${esc(w.id)}">Use</button>`}

        ${own ? `<button class="ghost danger" data-wdel="${esc(w.id)}">Delete</button>` : ""}</div>
      ${c === "use" ? `<span class="confirm">Switch to ${esc(w.name)} and clear all scores? <button class="solid-danger" id="wUseYes" data-w="${esc(w.id)}">Switch</button><button class="ghost" id="wNo">Cancel</button></span>` : ""}

    </div>`;

    <h2>Workouts</h2>

    <div class="actions"><button class="ghost" id="wPrompt" data-label="Copy instructions for a chatbot">Copy instructions for a chatbot</button></div>
    <textarea id="wPaste" class="paste" rows="6" spellcheck="false" placeholder="Paste the chatbot's answer here" aria-label="Workout to add">${esc(pasteText)}</textarea>
    <div class="actions"><button class="ghost" id="wCheck">Check</button>
      ${pc && pc.w ? `<button class="solid" id="wSave">${saved[pc.w.id] ? "Replace" : "Save"} ${esc(pc.w.name)}</button>` : ""}</div>
    ${pc ? pc.errors.length ? pc.errors.map(e => `<p class="err">${esc(e)}</p>`).join("")
      : `<p class="note"><b>${esc(pc.w.name)}</b>, ${pc.w.teams} teams of ${pc.w.teamSize}${pc.w.rounds > 1 ? `, ${pc.w.rounds} rounds (every station repeats)` : ""}${pc.w.slot ? `, everyone moves on every ${fmt(pc.w.slot)}${pc.w.ranked ? "" : ", not ranked"}` : ""}${pc.w.timer !== undefined ? (pc.w.timer ? `, ${fmt(pc.w.timer)} countdown timer` : ", clock counts up") : ""}. Check the stations before you save:</p>
        <ul class="note">${pc.w.stations.map(s => `<li><b>${esc(s.name)}</b>: ${esc(describe(s))}${s.time ? `, ${fmt(s.time)} work` : ""}${s.type === "count" ? ", + buttons " + s.steps.join("/") : ""}${s.type === "emom" ? ": " + esc(s.moves.join(", ")) : ""}${s.info ? ` · ${esc(s.info)}` : ""}</li>`).join("")}</ul>

function renderLive() {
  // Every change of session, role or connection passes through here, so the phone's online entry follows it.
  syncPresence(); watchOnline();
  if (screenMode) { $("live").hidden = true; return; }
  const el = $("live"), msg = liveMsg ? `<p class="note">${esc(liveMsg)}</p>` : "";
  const conn = `<span class="conn${connected ? "" : " off"}">${connected ? "Live" : "Offline, will sync"}</span>`;
  const label = eventId ? `<span>Session <b>${esc(eventLabel(eventId))}</b></span>` : "";
  el.removeAttribute("style");
  if (view === "local") {
    el.innerHTML = FIREBASE_CONFIG ? `
      <div class="live-top"><h2>Team phones</h2><a class="solid" href="${baseUrl()}">Back to live scoring</a></div>
      <p class="note">This phone is counting on its own. Nothing here is shared.</p>` : "";
  } else if (trainerLocked() && (view === "trainer" || view === "missing")) {
    // Typing the PIN: a live update mustn't wipe what's typed.
    if (document.activeElement?.id === "pinIn") return;
    el.innerHTML = `
      <div class="live-top"><h2>Trainer PIN</h2>${conn}</div>
      ${pinState === "check" ? `<p class="note">Checking this phone…</p>`
        : pinState === "noauth" ? `<p class="note">This phone can't sign in as trainer. In the Firebase console, Authentication > Anmeldemethode: switch on Anonym, then reload this page.</p>
          <div class="actions"><button class="ghost" data-role="">I'm not the trainer</button></div>` : `
      <p class="note">Type the trainer PIN once on this phone to start sessions, run the clock and change teams. Athletes don't need it.</p>
      <form class="actions" id="pinForm"><input id="pinIn" class="date" type="password" inputmode="numeric" autocomplete="off" maxlength="30" aria-label="Trainer PIN" placeholder="PIN">
        <button class="solid">Unlock</button><button type="button" class="ghost" data-role="">I'm not the trainer</button></form>
      ${pinMsg ? `<p class="note" role="status">${esc(pinMsg)}</p>` : ""}`}`;
  } else if (view === "trainer" && !eventId.startsWith(today())) {
    el.innerHTML = `
      <div class="live-top">${label} ${eventId.slice(0, 4)}${conn}</div>
      <p class="note">Past session, open only on your phone. Pick each team with the tabs below and type in its numbers${W.rounds > 1 ? " for every round" : ""}. The teams' phones aren't affected.</p>
      <div class="actions"><a class="solid" href="${baseUrl()}">Back to today</a></div>${msg}`;
  } else if (view === "trainer") {
    el.innerHTML = `
      <div class="live-top">${label}${conn}</div>
      <p class="note">Teams scan the QR code and pick their team once; their phone remembers it every week. You can fix any team's numbers below.</p>
      <p class="note" id="onlineNow" aria-live="polite"></p>
      <div class="actions"><button class="solid" id="qrOpen">Show QR codes</button>
        <a class="ghost" href="${baseUrl()}?screen" target="_blank" rel="noopener">Open big screen</a>
        ${forcedEvent ? `<a class="ghost" href="${baseUrl()}">Back to today</a>` : ""}</div>${msg}`;
  } else if (view === "team") {
    el.setAttribute("style", tc(state.active));
    el.innerHTML = `
      <div data-lock><div class="live-top"><span class="lock-title" data-lt></span>${conn}</div>
      <div class="lock-bar" data-lb><span></span></div>
      <p class="note" data-ls></p></div>${msg}`;
    lockTick();
  } else if (view === "pick") {
    el.innerHTML = `<div class="live-top">${label}${conn}</div>${msg}`;
  } else if (view === "wait") {
    el.innerHTML = `<p class="note">Joining ${eventId ? "session " + esc(eventLabel(eventId)) : "today's session"}…</p>`;
  } else if (view === "missing" && !forcedEvent) {
    el.innerHTML = `
      <div class="live-top"><h2>Today's session hasn't started</h2>${conn}</div>
      <p class="note">This page updates by itself as soon as the trainer starts it.${getRole() === "trainer" ? " Pick the workout and start it here. The teams from last time carry over." : ""}</p>
      ${getRole() === "trainer" ? `<div class="actions"><select class="date" id="startPick" aria-label="Workout for today">${workoutOptions(startPick)}</select>
        <button class="solid" id="startToday">Start today's session</button>
        <a class="ghost" href="${baseUrl()}?local">Use this phone on its own</a></div>` : `<p class="note trainer-entry">${trainerEntry()}</p>`}
      ${msg}`;
  } else {
    el.innerHTML = `
      <h2>${view === "missing" ? "Session not found" : "Live scoring unavailable"}</h2>
      <p class="note">${view === "missing" ? "There's no session for that date." : esc(liveMsg)}</p>
      <div class="actions"><a class="ghost" href="${baseUrl()}">Go to today's session</a><a class="ghost" href="${baseUrl()}?local">Use this phone on its own</a></div>`;
  }
  el.hidden = !el.innerHTML.trim();
  renderLinks(); renderOnline();
}

    <div class="actions"><input type="date" id="pastDate" min="${FIRST_DAY}" max="${t}" class="date"><button class="solid" id="addPast">Add</button><span class="msg" id="pastMsg"></span></div>
    ${view === "trainer" ? `<h3 class="sub">Session on screen · ${esc(eventLabel(eventId))}</h3>
    <span id="delArea"><button class="ghost danger" id="delSession">Delete this session</button></span>` : ""}`;
}

function renderPicker() {
  $("pickList").innerHTML = state.teams.map((t, i) =>
    `<button style="${tc(i)}" data-role="${t.id}"><span class="dot"></span>${esc(t.name)}</button>`).join("");
  $("trainerEntry").innerHTML = trainerEntry();
}
// Small and with a confirm, so athletes don't become the trainer by accident. Trainers use their own link.
let trainerAsk = false;
const trainerEntry = () => trainerAsk
  ? `Switch this phone to the trainer view? <button class="ghost" data-role="trainer">Yes, I'm the trainer</button> <button class="ghost" id="trainerNo">Cancel</button>`
  : `<button class="linkish" id="trainerAsk">Trainer?</button>`;

function renderSections() {
  if (screenMode) {
    for (const id of ["roundSeg", "board", "teams", "tools", "standCard", "picker"]) $(id).hidden = true;
    return;
  }
  const scoring = ["local", "trainer", "team"].includes(view);
  $("roundSeg").hidden = !scoring || W.rounds < 2 || trainerLocked();
  $("board").hidden = !scoring || trainerLocked();
  $("teams").hidden = $("setupCard").hidden = !(view === "local" || trainerOn());
  $("standCard").hidden = !(scoring || view === "pick");
  $("picker").hidden = view !== "pick";
  // On a team phone, the team and session sit under the scores; the top card is the screen-lock reminder.
  $("teamFoot").hidden = view !== "team";
  if (view === "team") $("teamFoot").innerHTML = `<span class="note">${esc(state.teams[state.active].name)} · Session ${esc(eventLabel(eventId))}</span><button class="ghost" data-role="">Switch team</button>`;
  $("tools").hidden = trainerLocked() || !(view === "local" || view === "trainer" || (view === "missing" && live && getRole() === "trainer"));
  $("toolsLabel").textContent = view === "local" ? "Workouts and teams" : "Trainer tools";
}

function renderAll() { renderStarts(); renderHelp(); renderHeader(); renderRound(); renderTeams(); renderBoard(); renderStandings(); renderLive(); renderPicker(); renderSections(); renderSessions(); renderWorkout(); renderHistory(); renderQrCard(); renderScreen(); renderBig(); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.round) { state.round = +b.dataset.round; editing = null; }
  else if (b.dataset.team) { state.active = +b.dataset.team; editing = null; }
  else if (b.dataset.k) {
    bump(state.active, b.dataset.k, +b.dataset.d);
  }
  else if (b.dataset.act) { const [act, sid] = b.dataset.act.split(":"); stationAction(state.active, act, sid); }
  else if (b.dataset.min) {
    const [sid, m] = b.dataset.min.split(":"), s = W.stations.find(s => s.id === sid);
    if (s.measure === "done") {
      const key = `${sid}_m${m}`, x = val(state.teams[state.active], state.round, key);
      setValue(state.active, key, !clockStart(state.round) ? (x + 1) % 3 : x === 2 ? (minutesPassed(s) >= +m ? 1 : 0) : 2);
    }
    else { emomSel[sid] = +m; editing = null; }
  }
  else if (b.dataset.edit) { editing = b.dataset.edit; renderBoard(); return; }
  else if (b.dataset.remove) { removeTeam(+b.dataset.remove); renderSetup(); }
  else if (b.dataset.role !== undefined) {
    setRole(b.dataset.role); editing = null; trainerAsk = false;
    if (b.dataset.role === "trainer" && live && pinState === "check") checkPin();
    const i = state.teams.findIndex(t => t.id === b.dataset.role);
    if (view !== "missing") view = b.dataset.role === "trainer" ? "trainer" : i >= 0 ? "team" : "pick";
    if (i >= 0) state.active = i;
    window.scrollTo(0, 0); renderSetup();
  }
  else if (b.dataset.share !== undefined) {
    return share(baseUrl() + (b.dataset.share ? "?team=" + b.dataset.share : ""), b);
  }
  else if (b.dataset.move !== undefined) movePick = +b.dataset.move;
  else if (b.dataset.movecancel !== undefined) movePick = null;
  else if (b.dataset.moveto !== undefined) { if (movePick !== null && state.teams[movePick]) moveStart(movePick, +b.dataset.moveto); movePick = null; }
  else if (b.dataset.qr !== undefined) { qrFor = b.dataset.qr; return renderQrCard(); }
  else if (b.id === "qrOpen") { qrFor = ""; renderQrCard(); $("qrCard").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  else if (b.id === "qrClose") { qrFor = null; return renderQrCard(); }
  else if (b.id === "screenShare") return share(baseUrl() + "?screen", b);
  else if (b.id === "trainerShare") return share(baseUrl() + "?trainer", b);
  else if (b.id === "trainerAsk" || b.id === "trainerNo") { trainerAsk = b.id === "trainerAsk"; }
  else if (b.dataset.switch) return switchSession(b.dataset.switch);
  else if (b.dataset.open) { location.href = baseUrl() + "?e=" + b.dataset.open; return; }
  else if (b.id === "addPast") return addPastSession($("pastDate").value, b);
  else if (b.id === "bigOn") { openBig(); editing = null; }
  else if (b.id === "bigOff") { editing = null; if (bigInHistory()) return closeBig(); setBig(false); }
  else if (b.id === "clockStart") startClock();
  else if (b.id === "clockReset") {
    $("clockArea").innerHTML = `<span class="confirm">Reset the clock? <button class="solid-danger" id="clockYes">Reset</button><button class="ghost" id="clockNo">Cancel</button></span>`;
    return;
  }
  else if (b.id === "clockYes") resetClock();
  else if (b.id === "clockNo") { if (editing === "__clock") editing = null; renderBoard(); return; }
  else if (b.id === "clockPause") pauseClock();
  else if (b.id === "clockResume") resumeClock();
  else if (b.id === "clockSet") { editing = "__clock"; renderBoard(); return; }
  else if (b.id === "clockSetOk") return commitClock();
  else if (b.dataset.wuse) {
    const w = byId(b.dataset.wuse); if (!w) return;
    wMsg = "";
    if (anyScores()) { wConfirm = { kind: "use", id: w.id }; return renderWorkout(true); }
    useWorkout(w);
  }
  else if (b.id === "wUseYes") { wConfirm = null; useWorkout(byId(b.dataset.w)); }
  else if (b.id === "wDelYes") { wConfirm = null; deleteWorkout(b.dataset.w); return renderWorkout(true); }
  else if (b.id === "wNo") { wConfirm = null; return renderWorkout(true); }
  else if (b.dataset.wdel) { wConfirm = { kind: "del", id: b.dataset.wdel }; return renderWorkout(true); }
  else if (b.dataset.wcopy) return copyText(JSON.stringify(byId(b.dataset.wcopy), null, 2), b);
  else if (b.id === "wPrompt") return copyText(LLM_PROMPT, b);
  else if (b.id === "wCheck") { pasteText = $("wPaste").value; pasteCheck = checkWorkout(pasteText); wMsg = ""; return renderWorkout(true); }
  else if (b.id === "wSave") return saveChecked(b);
  else if (b.id === "delSession") {
    $("delArea").innerHTML = `<span class="confirm">Delete ${esc(eventLabel(eventId))} and all its scores? This can't be undone. <button class="solid-danger" id="delYes">Delete</button><button class="ghost" id="delNo">Cancel</button></span>`;
    return;
  }
  else if (b.id === "delYes") return deleteSession();
  else if (b.id === "delNo") { renderSessions(); return; }
  else if (b.id === "startToday" || b.id === "startExtra") return startEvent(b, b.id === "startExtra");
  else if (b.id === "addTeam") { addTeam(); renderSetup(); }
  else if (b.id === "reset") {
    $("resetArea").innerHTML = `<span class="confirm">Clear every count for all teams? <button class="solid-danger" id="resetYes">Reset</button><button class="ghost" id="resetNo">Cancel</button></span>`;
    return;
  }
  else if (b.id === "resetYes" || b.id === "resetNo") {
    if (b.id === "resetYes") resetAll();
    $("resetArea").innerHTML = `<button class="ghost danger" id="reset">Reset all counts</button>`;
  }
  else return;
  save(); renderAll();
});

document.addEventListener("submit", e => {
  if (e.target.id !== "pinForm") return;
  e.preventDefault();
  const pin = $("pinIn").value.trim(); if (!pin) return;
  pinMsg = "Checking…"; $("pinIn").blur(); renderLive();
  checkPin(pin);
});

document.addEventListener("change", e => {
  if (e.target.id === "startPick") startPick = e.target.value;
  if (e.target.dataset.size !== undefined) { setSize(+e.target.dataset.size, +e.target.value); save(); renderAll(); }
});

document.addEventListener("input", e => {
  // Editing the pasted text means it has to be checked again before saving.
  if (e.target.id === "wPaste") { pasteText = e.target.value; if (pasteCheck) { pasteCheck = null; $("wSave")?.remove(); } return; }
  const i = e.target.dataset.name; if (i === undefined) return;
  rename(+i, e.target.value.trim() || "Team " + (+i + 1));
  save(); renderTeams(); renderBoard(); renderStandings(); renderLive();
});

// Keep the screen awake while counting, where the browser allows it. After AWAKE_MIN minutes without a tap
// the phone may lock itself again as usual, so a phone left in the gym doesn't stay unlocked for anyone to take.
// It stays on while the workout clock runs (up to its end, or an hour), and the big screen always stays on.
const AWAKE_MIN = 3;
let wakeHeld = null, wakeAsking = false, lastTap = Date.now();
const clockKeepsAwake = () => clockStart(state.round) > 0 && elapsed(state.round) < (clockEnd() || 3600);
const keepAwake = () => screenMode || Date.now() - lastTap < AWAKE_MIN * 60000 || clockKeepsAwake();
async function wake() {
  if (!navigator.wakeLock || document.visibilityState !== "visible") return;
  if (!keepAwake()) { const h = wakeHeld; wakeHeld = null; if (h && !h.released) h.release().catch(() => {}); return; }
  if ((wakeHeld && !wakeHeld.released) || wakeAsking) return;
  wakeAsking = true;
  try { wakeHeld = await navigator.wakeLock.request("screen"); } catch {}
  wakeAsking = false;
}
// The reminder on a team phone and in its big view: a bar that empties as the screen-on time runs out,
// full while the clock runs. The big view shows only the title and the bar.
function lockTick() {
  const boxes = document.querySelectorAll("[data-lock]"); if (!boxes.length) return;
  const left = Math.max(0, 1 - (Date.now() - lastTap) / (AWAKE_MIN * 60000)), workout = clockKeepsAwake(), w = (workout ? 100 : left * 100) + "%";
  for (const box of boxes) {
    const title = box.querySelector("[data-lt]"), bar = box.querySelector("[data-lb]"), fill = bar.firstElementChild, sub = box.querySelector("[data-ls]");
    const has = !!navigator.wakeLock;
    title.textContent = has && workout ? "Screen stays on during the workout" : "Lock your phone when you put it down";
    bar.hidden = !has;
    if (sub) sub.textContent = !has ? "" : workout ? "When the workout is over, lock your phone before you put it down."
      : left ? "The screen stays on while you're counting. When the bar runs out, your phone can lock itself again."
      : "Your phone can lock itself now. Tap to keep the screen on.";
    if (!has) continue;
    bar.classList.toggle("on", workout);
    // A freshly drawn bar jumps straight to its width instead of sliding there.
    if (!fill.style.width) { fill.style.transition = "none"; fill.style.width = w; void fill.offsetWidth; fill.style.transition = ""; }
    else fill.style.width = w;
  }
}
setInterval(lockTick, 1000);
for (const ev of ["pointerdown", "keydown"]) addEventListener(ev, () => { lastTap = Date.now(); wake(); lockTick(); }, true);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") lastTap = Date.now(); wake(); });
setInterval(wake, 15000);
wake();

renderSetup(); renderAll();
if (view !== "local") initLive();
</script>
</body></html>
